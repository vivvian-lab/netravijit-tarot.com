<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เนตรวิจิตร - ไพ่ทาโรต์ภูตผีไทยโบราณ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Cinzel+Decorative:wght@700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #0a0608;
      --bg-card: #150f14;
      --gold-primary: #d4af37;
      --gold-bright: #ffd700;
      --crimson-blood: #800a12;
      --crimson-light: #b3101d;
      --text-gold: #f5e6be;
      --text-muted: #bfa993;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(128, 10, 18, 0.35) 0%, transparent 65%),
        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, rgba(10, 6, 8, 0.98), rgba(5, 3, 4, 1));
      color: var(--text-gold);
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      padding-bottom: 120px;
    }

    .thai-border-frame {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      pointer-events: none;
      z-index: 99;
    }

    header {
      text-align: center;
      padding: 30px 20px 10px;
    }

    .kranok-badge {
      display: inline-block;
      font-family: 'Charm', cursive;
      font-size: 1.05rem;
      letter-spacing: 2px;
      color: var(--gold-bright);
      padding: 3px 20px;
      border-top: 1px solid var(--gold-primary);
      border-bottom: 1px solid var(--gold-primary);
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    h1 {
      font-family: 'Charm', cursive;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--gold-bright);
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.6), 0 2px 4px #000;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 650px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Mode Selector */
    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 18px 0 20px;
      padding: 0 15px;
    }

    .mode-btn {
      background: rgba(30, 20, 26, 0.8);
      border: 1px solid var(--gold-primary);
      color: var(--gold-bright);
      padding: 8px 22px;
      border-radius: 4px;
      font-family: 'Charm', cursive;
      font-size: 1.15rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .mode-btn:hover, .mode-btn.active {
      background: linear-gradient(135deg, var(--crimson-blood), #4a050b);
      border-color: var(--gold-bright);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .hint-bar {
      text-align: center;
      font-family: 'Charm', cursive;
      font-size: 1.25rem;
      color: var(--gold-bright);
      margin-bottom: 15px;
      min-height: 32px;
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    }

    /* Control Area */
    .control-area {
      text-align: center;
      margin: 0 0 25px;
    }

    .action-btn {
      background: linear-gradient(135deg, var(--gold-primary), #8a6c17);
      border: 1px solid var(--gold-bright);
      color: #0d0608;
      font-family: 'Charm', cursive;
      font-size: 1.35rem;
      font-weight: 700;
      padding: 10px 42px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
      transition: all 0.3s ease;
    }
    .action-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, var(--gold-bright), #d4af37);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
    }

    /* Board Area */
    .board-container {
      max-width: 950px;
      margin: 0 auto 35px;
      padding: 10px 15px;
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 25px;
      flex-wrap: nowrap;
    }

    .card-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: 0 0 auto;
    }

    .slot-label {
      font-family: 'Charm', cursive;
      font-size: 1.2rem;
      color: var(--gold-bright);
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
    }

    /* Card Sizing & Perspective */
    .card-wrapper {
      width: 220px;
      height: 380px;
      perspective: 1200px;
      cursor: pointer;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.2, 0.85, 0.32, 1.2);
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.85), 0 0 15px rgba(212, 175, 55, 0.25);
    }

    .card-wrapper.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--gold-primary);
      background: #0d090d;
    }

    /* Card Back */
    .card-back {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .click-prompt {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 6, 8, 0.9);
      border: 1px solid var(--gold-primary);
      color: var(--gold-bright);
      font-family: 'Charm', cursive;
      font-size: 0.95rem;
      padding: 3px 14px;
      border-radius: 15px;
      pointer-events: none;
      white-space: nowrap;
      text-shadow: 0 0 5px var(--gold-bright);
    }

    .card-wrapper.flipped .click-prompt {
      display: none;
    }

    /* Card Front */
    .card-front {
      transform: rotateY(180deg);
      background-color: #0b0709;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Reading Interpretation Section */
    .reading-sheet {
      max-width: 900px;
      margin: 40px auto 30px;
      padding: 35px 30px;
      background: rgba(21, 15, 20, 0.96);
      border: 1px solid var(--gold-primary);
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      display: none;
      clear: both;
    }

    .reading-sheet.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    .reading-header {
      text-align: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .reading-header h2 {
      font-family: 'Charm', cursive;
      font-size: 2.2rem;
      color: var(--gold-bright);
    }

    .interpretation-card {
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      animation: fadeIn 0.5s ease;
    }
    .interpretation-card:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .card-meta-title {
      font-family: 'Charm', cursive;
      font-size: 1.6rem;
      color: var(--gold-bright);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-keywords {
      display: inline-block;
      font-size: 0.95rem;
      color: var(--gold-primary);
      margin-bottom: 12px;
      background: rgba(212, 175, 55, 0.1);
      padding: 2px 10px;
      border-radius: 4px;
    }

    .card-essence {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #ede3d1;
      margin-bottom: 15px;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 16px;
      border-left: 3px solid var(--crimson-blood);
      border-radius: 0 6px 6px 0;
    }

    .aspects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .aspect-box {
      background: rgba(35, 20, 28, 0.6);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 6px;
      padding: 12px 15px;
    }

    .aspect-title {
      font-family: 'Charm', cursive;
      font-size: 1.15rem;
      color: var(--gold-bright);
      margin-bottom: 5px;
    }

    .aspect-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      .card-wrapper { width: 110px; height: 190px; }
      .board-container { gap: 10px; padding: 5px; }
      .slot-label { font-size: 0.95rem; }
      .click-prompt { font-size: 0.75rem; padding: 2px 8px; }
      .aspects-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  let currentMode = 1;
    let selectedCards = [];
    let hasShuffled = false;

    // --- ระบบจำลองเสียงเอฟเฟกต์เวทมนตร์ (Web Audio API ไม่ต้องใช้ไฟล์เสียง) ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 1. เสียงรูดสับไพ่ (ฟึ่บๆๆ)
    function playShuffleSound() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      for (let i = 0; i < 7; i++) {
        const time = now + i * 0.05;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120 + Math.random() * 180, time);
        osc.frequency.exponentialRampToValueAtTime(30, time + 0.04);

        gain.gain.setValueAtTime(0.12, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(time);
        osc.stop(time + 0.04);
      }
    }

    // 2. เสียงปิ๊งประกายแก้วตอนแตะเปิดไพ่ (กริ๊ง~)
    function playChimeSound() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const freqs = [1046.50, 1318.51, 1567.98, 2093.00];
      freqs.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.04);

        gain.gain.setValueAtTime(0.12, now + idx * 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.04 + 1.2);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.04);
        osc.stop(now + idx * 0.04 + 1.2);
      });
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-1').classList.toggle('active', mode === 1);
      document.getElementById('btn-mode-3').classList.toggle('active', mode === 3);
      resetBoard();
    }

    function resetBoard() {
      const board = document.getElementById('board');
      const readingSheet = document.getElementById('reading-sheet');
      const hint = document.getElementById('hint-bar');
      board.innerHTML = '';
      readingSheet.classList.remove('active');
      document.getElementById('reading-content').innerHTML = '';
      hasShuffled = false;

      hint.innerText = '✦ ตั้งจิตอธิษฐาน แล้วกด "อัญเชิญญาณสับไพ่" ✦';

      const labels = currentMode === 1 
        ? ["ดวงชะตาวันนี้"] 
        : ["ตำแหน่ง ๑ : อดีต", "ตำแหน่ง ๒ : ปัจจุบัน", "ตำแหน่ง ๓ : อนาคต"];

      for (let i = 0; i < currentMode; i++) {
        const slot = document.createElement('div');
        slot.className = 'card-slot';
        slot.innerHTML = `
          <div class="slot-label">${labels[i]}</div>
          <div class="card-wrapper" id="card-${i}" onclick="revealCard(${i})">
            <div class="card-inner">
              <div class="card-face card-back">
                <img src="หลังไพ่.png" alt="หลังไพ่ เนตรวิจิตร" onerror="if(!this.dataset.alt){this.dataset.alt='1';this.src='หลังไพ่[Card Back].png';}">
                <div class="click-prompt">แตะเพื่อเปิดญาณ</div>
              </div>
              <div class="card-face card-front" id="front-${i}"></div>
            </div>
          </div>
        `;
        board.appendChild(slot);
      }
    }

    function startReading() {
      playShuffleSound(); // เล่นเสียงสับไพ่

      const shuffled = [...tarotDeck].sort(() => 0.5 - Math.random());
      selectedCards = shuffled.slice(0, currentMode);
      hasShuffled = true;

      for (let i = 0; i < currentMode; i++) {
        document.getElementById(`card-${i}`).classList.remove('flipped');
        const front = document.getElementById(`front-${i}`);
        front.innerHTML = `<img src="${selectedCards[i].img}" alt="${selectedCards[i].name}">`;
      }

      document.getElementById('reading-content').innerHTML = '';
      document.getElementById('reading-sheet').classList.remove('active');

      const hint = document.getElementById('hint-bar');
      if (currentMode === 1) {
        hint.innerHTML = '✦ สำรับเนตรวิจิตรพร้อมแล้ว <strong>แตะที่ไพ่</strong> เพื่อเปิดดวงชะตา ✦';
      } else {
        hint.innerHTML = '✦ สำรับเนตรวิจิตรพร้อมแล้ว <strong>แตะเลือกเปิดไพ่ใบใดก่อนก็ได้</strong> ตามจิตศรัทธา ✦';
      }
    }

    function revealCard(idx) {
      if (!hasShuffled) {
        startReading();
      }

      const cardWrapper = document.getElementById(`card-${idx}`);
      if (!cardWrapper.classList.contains('flipped')) {
        playChimeSound(); // เล่นเสียงปิ๊งเมื่อแตะเปิดไพ่
        cardWrapper.classList.add('flipped');
        renderInterpretationItem(idx);
      }
    }

    function renderInterpretationItem(idx) {
      const sheet = document.getElementById('reading-sheet');
      const content = document.getElementById('reading-content');
      const card = selectedCards[idx];

      const labels = currentMode === 1 
        ? ["ญาณหยั่งรู้ประจำวัน"] 
        : ["ตำแหน่งที่ ๑ : อดีต / วิบากกรรมที่ส่งผล", "ตำแหน่งที่ ๒ : ปัจจุบัน / สภาวะจิตและบททดสอบ", "ตำแหน่งที่ ๓ : อนาคต / วิถีทางคลี่คลาย"];

      if (document.getElementById(`interpretation-${idx}`)) return;

      const item = document.createElement('div');
      item.id = `interpretation-${idx}`;
      item.className = 'interpretation-card';
      item.innerHTML = `
        <div style="color: var(--crimson-light); font-size: 0.95rem; font-weight: 600; margin-bottom: 4px;">
          ${labels[idx]}
        </div>
        <div class="card-meta-title">
          <span>✦ ${card.name} (${card.num})</span>
          <span style="font-size: 1rem; color: var(--text-muted); font-weight: normal;">• ${card.arcana}</span>
        </div>
        <div class="card-keywords">${card.keywords}</div>
        <div class="card-essence">
          <strong>ความหมายแห่งญาณ:</strong> ${card.meaning}
        </div>
        <div class="aspects-grid">
          <div class="aspect-box">
            <div class="aspect-title">💼 ด้านการงานและอำนาจ</div>
            <div class="aspect-desc">${card.work}</div>
          </div>
          <div class="aspect-box">
            <div class="aspect-title">💰 ด้านโชคลาภและการเงิน</div>
            <div class="aspect-desc">${card.finance}</div>
          </div>
          <div class="aspect-box">
            <div class="aspect-title">❤️ ด้านความรักและสายสัมพันธ์</div>
            <div class="aspect-desc">${card.love}</div>
          </div>
        </div>
      `;

      let inserted = false;
      const children = content.children;
      for (let i = 0; i < children.length; i++) {
        const childId = parseInt(children[i].id.replace('interpretation-', ''));
        if (idx < childId) {
          content.insertBefore(item, children[i]);
          inserted = true;
          break;
        }
      }
      if (!inserted) {
        content.appendChild(item);
      }

      sheet.classList.add('active');
    }

    window.onload = resetBoard;
  </script>
