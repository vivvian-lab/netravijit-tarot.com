<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เนตรวิจิตรบรรจง • โต๊ะพยากรณ์แม่หมอ</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0c0509;
      --bg-panel: #160a12;
      --gold-primary: #d4af37;
      --gold-glow: #ffd966;
      --accent-red: #8b0000;
      --text-light: #f5ebe6;
      --text-muted: #c4a9b2;
      --card-ratio: 1.6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 20%, #290f1e 0%, var(--bg-dark) 85%);
      color: var(--text-light);
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* แถบหัวแม่หมอ */
    header {
      padding: 12px 16px;
      background: rgba(22, 10, 18, 0.9);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: var(--gold-primary);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    .brand span {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold-primary);
      color: var(--gold-glow);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-action:active {
      transform: scale(0.95);
      background: var(--gold-primary);
      color: #000;
    }

    /* ตัวเลือกโหมดจำนวนใบ */
    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(10, 4, 8, 0.6);
    }

    .mode-pill {
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-pill.active {
      background: linear-gradient(135deg, var(--accent-red), #4a0000);
      border-color: var(--gold-glow);
      color: var(--gold-glow);
      font-weight: 600;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    /* โต๊ะปูไพ่ (Mat Area) */
    .mat-container {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
    }

    /* แท่นวางไพ่ที่เลือกแล้ว */
    .spread-slots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 700px;
      min-height: 180px;
      margin-top: 6px;
    }

    .slot-box {
      width: 105px;
      height: 168px;
      border: 1px dashed rgba(212, 175, 55, 0.35);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: rgba(22, 10, 18, 0.4);
      transition: all 0.3s ease;
    }

    .slot-box.filled {
      border: 1px solid var(--gold-primary);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      background: transparent;
    }

    .slot-label {
      font-size: 0.72rem;
      color: var(--gold-primary);
      margin-bottom: 4px;
      font-weight: 600;
    }

    /* การ์ดไพ่ */
    .tarot-card {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      position: relative;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      position: relative;
    }

    .tarot-card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      backface-visibility: hidden;
      overflow: hidden;
      border: 1px solid var(--gold-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* หลังไพ่ */
    .card-back {
      background: linear-gradient(135deg, #1f0814 0%, #0d0407 100%);
      box-shadow: inset 0 0 12px rgba(212, 175, 55, 0.25);
    }

    .card-back-emblem {
      width: 44px;
      height: 44px;
      border: 1px solid var(--gold-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-glow);
      font-size: 1.2rem;
      text-shadow: 0 0 8px var(--gold-primary);
    }

    /* หน้าไพ่ */
    .card-front {
      background: #140811;
      transform: rotateY(180deg);
      padding: 6px;
      text-align: center;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
    }

    .card-fallback-art {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #2d0f20, #12050c);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 6px;
    }

    .card-fallback-num {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      color: var(--gold-primary);
    }

    .card-fallback-name {
      font-size: 0.8rem;
      color: var(--gold-glow);
      margin: 8px 0;
      font-weight: 600;
      line-height: 1.2;
    }

    .card-fallback-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* แผงคลี่ไพ่สำหรับให้ลูกดวงเลือก (Fanned Deck) */
    .deck-strip-section {
      width: 100%;
      margin-top: auto;
      padding: 12px 0 20px;
      background: rgba(10, 4, 8, 0.75);
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }

    .strip-hint {
      text-align: center;
      font-size: 0.8rem;
      color: var(--gold-glow);
      margin-bottom: 8px;
    }

    .card-strip {
      display: flex;
      overflow-x: auto;
      padding: 10px 20px;
      gap: -20px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .card-strip::-webkit-scrollbar {
      display: none;
    }

    .strip-card {
      flex: 0 0 54px;
      height: 86px;
      margin-right: -24px;
      border: 1px solid var(--gold-primary);
      border-radius: 6px;
      background: linear-gradient(135deg, #260a1a, #0d0407);
      box-shadow: -4px 0 8px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-primary);
      font-size: 0.8rem;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .strip-card:active {
      transform: translateY(-16px) scale(1.1);
      z-index: 10;
      border-color: var(--gold-glow);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    /* ปุ่มสั่งการกลางโต๊ะ */
    .table-controls {
      display: flex;
      gap: 10px;
    }

    .btn-table {
      background: linear-gradient(135deg, #360f23, #1a0611);
      border: 1px solid var(--gold-primary);
      color: var(--gold-glow);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .btn-table.primary {
      background: linear-gradient(135deg, var(--accent-red), #540000);
      border-color: var(--gold-glow);
      font-weight: 600;
    }

    .btn-table:active {
      transform: scale(0.96);
    }

    /* หน้าต่างโมดอล: ขยายไพ่ใหญ่ & คัมภีร์ญาณแม่หมอ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 2, 4, 0.85);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-panel);
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 1.4rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }

    .cheat-card-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    }

    .cheat-header {
      display: flex;
      justify-content: space-between;
      color: var(--gold-glow);
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .cheat-keywords {
      font-size: 0.8rem;
      color: var(--text-light);
      line-height: 1.4;
    }

    .cheat-cat {
      font-size: 0.72rem;
      color: var(--gold-primary);
      margin-top: 4px;
    }

    .search-input {
      width: 100%;
      background: rgba(10, 4, 8, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 8px;
      color: var(--text-light);
      padding: 8px 12px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- แถบหัวระบบแม่หมอ -->
  <header>
    <div class="brand">
      <h1>NETRA VIJIT</h1>
      <span>โต๊ะพยากรณ์แม่หมอ (Reader Mode)</span>
    </div>
    <div class="header-actions">
      <button class="btn-action" onclick="openCheatSheet()">
        📜 คัมภีร์ญาณ
      </button>
      <button class="btn-action" onclick="resetMat()">
        🔄 ล้างกระดาน
      </button>
    </div>
  </header>

  <!-- แถบเลือกจำนวนใบพยากรณ์ -->
  <div class="mode-bar">
    <button class="mode-pill active" onclick="setMode(1)">๑ ใบ (แก่นคำตอบ)</button>
    <button class="mode-pill" onclick="setMode(3)">๓ ใบ (อดีต-ปัจจุบัน-อนาคต)</button>
    <button class="mode-pill" onclick="setMode(5)">๕ ใบ (ชะตาพิสดาร)</button>
  </div>

  <!-- โต๊ะปูไพ่เสมือนจริง -->
  <main class="mat-container">
    <div class="spread-slots" id="slots-area">
      <!-- ช่องวางไพ่จะถูกเรนเดอร์โดยอัตโนมัติตามโหมด -->
    </div>

    <div class="table-controls">
      <button class="btn-table" onclick="shuffleCurrentDeck()">
        🌀 อัญเชิญญาณสับไพ่
      </button>
      <button class="btn-table primary" id="reveal-btn" onclick="revealAllCards()">
        ✦ เปิดไพ่ทั้งหมด ✦
      </button>
    </div>
  </main>

  <!-- แผงคลี่ไพ่ด้านล่างเพื่อให้ลูกดวงแตะเลือกสด ๆ -->
  <section class="deck-strip-section">
    <div class="strip-hint" id="strip-hint-text">
      ✨ ส่งมือถือให้ลูกดวงตั้งจิตอธิษฐาน แล้วแตะเลือกไพ่ที่สัมผัสจิต (เลือก ๑ ใบ)
    </div>
    <div class="card-strip" id="card-strip">
      <!-- ไพ่ในกองจะถูกวางเรียงตรงนี้ -->
    </div>
  </section>

  <!-- โมดอลคัมภีร์ญาณ (Cheat Sheet ช่วยแม่หมอทวนความหมายสด) -->
  <div class="modal-overlay" id="cheat-modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeCheatSheet()">&times;</span>
      <h3 style="color: var(--gold-glow); font-family: 'Cinzel', serif; margin-bottom: 8px;">📜 คัมภีร์ญาณเนตรวิจิตร ๗๘ ใบ</h3>
      <input type="text" id="cheat-search" class="search-input" placeholder="พิมพ์ชื่อไพ่ หรือความหมายเพื่อค้นหา..." oninput="filterCheatList()">
      <div id="cheat-list" style="max-height: 60vh; overflow-y: auto;">
        <!-- รายการคีย์เวิร์ดไพ่สำหรับแม่หมอ -->
      </div>
    </div>
  </div>

      { id: 71, name: "Eight of Pentacles", thai: "แปดเหรียญขัดเกลาฝีมือ (๘ เหรียญ)", tag: "ความชำนาญ • ความมุมานะ • รายได้จากวิชาชีพ", work: "ตั้งหน้าตั้งตาทำงานฝีมือ ผลงานประณีต ยิ่งทำยิ่งชำนาญ รายได้มั่นคง", love: "ไม่มีเวลาหวานชื่น มุ่งมั่นสร้างเนื้อสร้างตัวเพื่ออนาคต", warning: "บ้างานมากเกินไปจนละเลยสุขภาพและความสัมพันธ์ใกล้ชิด" },
      { id: 72, name: "Nine of Pentacles", thai: "เก้าเหรียญสุขสำราญมั่งคั่ง (๙ เหรียญ)", tag: "ความมั่งคั่งด้วยลำแข้ง • สวยรวยเก่ง • พึ่งพาตนเอง", work: "ฐานะการเงินมั่นคงมาก สบายใจกับความสำเร็จที่สร้างมาด้วยตนเอง", love: "โสดอย่างมีระดับ มีความสุขกับชีวิตตนเอง หรือได้คู่ที่ฐานะดีเลิศ", warning: "ระวังความเคยชินกับการอยู่คนเดียวจนปิดกั้นไม่ให้ใครเข้ามา" },
      { id: 73, name: "Ten of Pentacles", thai: "สิบเหรียญมรดกวงศ์ตระกูล (๑๐ เหรียญ)", tag: "ความมั่นคงรุ่นสู่รุ่น • มรดกตกทอด • มั่งคั่งสูงสุด", work: "ธุรกิจครอบครัวมั่นคง ได้รับมรดก อสังหาริมทรัพย์ หรือเงินก้อนใหญ่", love: "ครอบครัวทั้งสองฝ่ายยอมรับ แต่งงานสร้างรากฐานที่มั่งคั่งร่วมกัน", warning: "ระวังข้อพิพาทเรื่องผลประโยชน์หรือทรัพย์สินภายในตระกูล" },
      { id: 74, name: "Page of Pentacles", thai: "พรายน้อยเรียนรู้ทรัพย์ (มหาดเล็กเหรียญ)", tag: "โอกาสทางการเงินใหม่ • การศึกษาลงทุน • ขยันขันแข็ง", work: "ได้รับข่าวดีเรื่องเงินทุน ได้ศึกษาต่อยอดทักษะการทำเงินใหม่ ๆ", love: "ความรักเรียบง่าย มั่นคง ค่อย ๆ พัฒนาความรู้สึกไปด้วยกัน", warning: "ค่อย ๆ ลงทุน อย่าเพิ่งทุ่มเงินก้อนใหญ่โดยที่ยังไม่เข้าใจถ่องแท้" },
      { id: 75, name: "Knight of Pentacles", thai: "อัศวินก้าวช้าแต่มั่นคง (อัศวินเหรียญ)", tag: "ความพากเพียร • มั่นคงซื่อตรง • ช้าแต่ชัวร์", work: "ทำงานรอบคอบ ไม่ยอมผิดพลาด วางแผนการเงินอย่างรัดกุมที่สุด", love: "รักมั่นคง ซื่อสัตย์ แต่ไม่โรแมนติก เน้นสร้างอนาคตที่จับต้องได้", warning: "เชื่องช้าเกินไปจนอาจพลาดโอกาสทางธุรกิจที่ต้องอาศัยความเร็ว" },
      { id: 76, name: "Queen of Pentacles", thai: "ราชินีธรณีอุดมสมบูรณ์ (ราชินีเหรียญ)", tag: "แม่บ้านการเรือน • บริหารเงินฉลาด • ดูแลเอาใจใส่", work: "บริหารบัญชีการเงินยอดเยี่ยม จัดการงานในบ้านและธุรกิจได้ครบเครื่อง", love: "คนรักคอยดูแลเอาใจใส่เรื่องอาหารการกินและความเป็นอยู่อย่างดีเลิศ", warning: "กังวลเรื่องเงินทองและความมั่นคงจนลืมหาความสุขใส่ตัว" },
      { id: 77, name: "King of Pentacles", thai: "ราชาเศรษฐีบารมีค้ำจุน (ราชาเหรียญ)", tag: "มหาเศรษฐี • มั่นคงสูงสุด • เจ้าของกิจการผู้มั่งคั่ง", work: "ประสบความสำเร็จสูงสุดด้านการเงินและธุรกิจ มีบารมีและเครดิตยอดเยี่ยม", love: "คู่ครองฐานะมั่นคงมาก เป็นเสาหลักและที่พึ่งพาให้ทั้งครอบครัวได้อย่างสมบูรณ์", warning: "ระวังการวัดคุณค่าของทุกสิ่งในชีวิตด้วยเงินตราเพียงอย่างเดียว" }
    ];
    let currentTargetCount = 1;
    let selectedCards = [];
    let isFlipped = false;
    let poolCards = [];

    // เริ่มต้นระบบ
    function initMat() {
      renderSlots();
      resetDeckPool();
      renderStrip();
    }

    // กำหนดโหมดจำนวนใบ
    function setMode(count) {
      currentTargetCount = count;
      document.querySelectorAll('.mode-pill').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      const hints = {
        1: "✨ ส่งมือถือให้ลูกดวงตั้งจิตอธิษฐาน แล้วแตะเลือกไพ่ที่สัมผัสจิต (เลือก ๑ ใบ)",
        3: "✨ ส่งมือถือให้ลูกดวงเลือกไพ่ ๓ ใบ (อดีต • ปัจจุบัน • อนาคต)",
        5: "✨ ส่งมือถือให้ลูกดวงเลือกไพ่ ๕ ใบ (ชะตาพิสดาร ๕ มิติ)"
      };
      document.getElementById('strip-hint-text').innerText = hints[count] || `✨ แตะเลือกไพ่ให้ครบ ${count} ใบ`;
      
      resetMat();
    }

    // วาดแท่นวางไพ่
    function renderSlots() {
      const area = document.getElementById('slots-area');
      area.innerHTML = '';
      
      const labels3 = ["อดีต (ต้นสาย)", "ปัจจุบัน (ตัวตน)", "อนาคต (ปลายทาง)"];
      const labels5 = ["จุดยืน", "อุปสรรค", "จิตใต้สำนึก", "แนวทางแก้ไข", "ผลลัพธ์"];

      for (let i = 0; i < currentTargetCount; i++) {
        let label = `ใบที่ ${i + 1}`;
        if (currentTargetCount === 3) label = labels3[i];
        if (currentTargetCount === 5) label = labels5[i];

        const slot = document.createElement('div');
        slot.className = 'slot-box';
        slot.id = `slot-${i}`;
        slot.innerHTML = `<span class="slot-label">${label}</span>`;
        area.appendChild(slot);
      }
    }

    // รีเซ็ตสำรับไพ่
    function resetDeckPool() {
      poolCards = [...tarotDeckData].sort(() => Math.random() - 0.5);
    }

    // สับไพ่
    function shuffleCurrentDeck() {
      resetDeckPool();
      renderStrip();
      const hint = document.getElementById('strip-hint-text');
      hint.innerText = "🌀 สับญาณไพ่เรียบร้อยแล้ว เชิญลูกดวงตั้งจิตเลือกไพ่อีกครั้ง";
    }

    // แสดงกองไพ่สำหรับเลือก
    function renderStrip() {
      const strip = document.getElementById('card-strip');
      strip.innerHTML = '';
      
      // โค้ดใหม่ (แสดงครบ ๗๘ ใบให้ลูกดวงเลื่อนปาดเลือก):
for (let i = 0; i < poolCards.length; i++) {
        const c = document.createElement('div');
        c.className = 'strip-card';
        c.innerHTML = '✦';
        c.onclick = () => pickCard(i, c);
        strip.appendChild(c);
      }
    }

    // เมื่อลูกดวงแตะเลือกไพ่
    function pickCard(index, element) {
      if (selectedCards.length >= currentTargetCount) {
        alert('เลือกไพ่ครบจำนวนตามที่กำหนดแล้วเจ้าค่ะ กดปุ่ม "เปิดไพ่ทั้งหมด" ได้เลย');
        return;
      }

      element.style.visibility = 'hidden';
      const cardData = poolCards[index] || poolCards[0];
      selectedCards.push(cardData);

      const currentSlotIndex = selectedCards.length - 1;
      const targetSlot = document.getElementById(`slot-${currentSlotIndex}`);
      
      targetSlot.classList.add('filled');
      targetSlot.innerHTML = `
        <div class="tarot-card" id="card-${currentSlotIndex}" onclick="toggleSingleCard(${currentSlotIndex})">
          <div class="card-inner">
            <div class="card-face card-back">
              <div class="card-back-emblem">✦</div>
            </div>
            <div class="card-face card-front">
              <div class="card-fallback-art">
                <span class="card-fallback-num">${cardData.name}</span>
                <span class="card-fallback-name">${cardData.thai}</span>
                <span class="card-fallback-sub">${cardData.tag}</span>
              </div>
            </div>
          </div>
        </div>
      `;

      if (selectedCards.length === currentTargetCount) {
        document.getElementById('strip-hint-text').innerText = "🔮 เลือกไพ่ครบแล้ว! แตะที่ตัวไพ่เพื่อเปิดทีละใบ หรือกดปุ่มเปิดทั้งหมด";
      }
    }

    // พลิกไพ่ทีละใบเมื่อแตะ
    function toggleSingleCard(index) {
      const cardEl = document.getElementById(`card-${index}`);
      if (cardEl) {
        cardEl.classList.toggle('flipped');
      }
    }

    // เปิดไพ่ทั้งหมดพร้อมกัน
    function revealAllCards() {
      if (selectedCards.length === 0) {
        alert('กรุณาให้ลูกดวงแตะเลือกไพ่ก่อนเปิดนะเจ้าคะ');
        return;
      }
      for (let i = 0; i < selectedCards.length; i++) {
        const cardEl = document.getElementById(`card-${i}`);
        if (cardEl) {
          cardEl.classList.add('flipped');
        }
      }
      isFlipped = true;
    }

    // ล้างกระดานเพื่อเริ่มดูลูกดวงคนใหม่
    function resetMat() {
      selectedCards = [];
      isFlipped = false;
      renderSlots();
      resetDeckPool();
      renderStrip();
    }

    // เปิดคัมภีร์ญาณ (Cheat Sheet)
    function openCheatSheet() {
      document.getElementById('cheat-modal').classList.add('active');
      renderCheatList(tarotDeckData);
    }

    function closeCheatSheet() {
      document.getElementById('cheat-modal').classList.remove('active');
    }

    function renderCheatList(list) {
      const container = document.getElementById('cheat-list');
      container.innerHTML = '';
      list.forEach(c => {
        const item = document.createElement('div');
        item.className = 'cheat-card-item';
        item.innerHTML = `
          <div class="cheat-header">
            <span>${c.thai}</span>
            <span style="font-family: 'Cinzel'; font-size: 0.75rem;">${c.name}</span>
          </div>
          <div class="cheat-keywords"><b>แก่นชะตา:</b> ${c.tag}</div>
          <div class="cheat-cat">💼 <b>งาน/เงิน:</b> ${c.work}</div>
          <div class="cheat-cat">💖 <b>ความรัก:</b> ${c.love}</div>
          <div class="cheat-cat" style="color: #ff9999;">⚠️ <b>ข้อเตือนสติ:</b> ${c.warning}</div>
        `;
        container.appendChild(item);
      });
    }

    function filterCheatList() {
      const query = document.getElementById('cheat-search').value.toLowerCase();
      const filtered = tarotDeckData.filter(c => 
        c.thai.toLowerCase().includes(query) || 
        c.name.toLowerCase().includes(query) || 
        c.tag.toLowerCase().includes(query) ||
        c.work.toLowerCase().includes(query)
      );
      renderCheatList(filtered);
    }

    // เริ่มการทำงาน
    window.onload = initMat;
  </script>
</body>
</html>
